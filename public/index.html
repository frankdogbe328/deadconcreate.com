<div id="root"></div>
<script type="text/babel" data-presets="react">
const API = '/api';

// ── STATE MANAGEMENT (simple, no Redux) ───────────────────────────────────────
function useLocalStorage(key, def) {
  const [v, setV] = React.useState(() => { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : def; } catch { return def; } });
  const set = val => { setV(val); try { if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val)); } catch {} };
  return [v, set];
}

function useApi() {
  const token = localStorage.getItem('dc_token');
  const req = async (method, path, body) => {
    const res = await fetch(`${API}${path}`, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) }, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  };
  return { get: p => req('GET', p), post: (p,b) => req('POST', p, b), put: (p,b) => req('PUT', p, b), patch: (p,b) => req('PATCH', p, b), del: p => req('DELETE', p) };
}

// ── SCROLL-REVEAL + COUNT-UP HOOKS ────────────────────────────────────────────
function useReveal(deps=[]) {
  React.useEffect(() => {
    const els = document.querySelectorAll('.reveal:not(.in)');
    if (!els.length) return;
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { threshold: .15 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, deps);
}
function useCountUp(target, dur = 1600) {
  const [v, setV] = React.useState(0);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current) return;
    const io = new IntersectionObserver(es => {
      if (es[0].isIntersecting) {
        const start = performance.now();
        const tick = t => { const p = Math.min(1,(t-start)/dur); setV(Math.floor(target*p)); if (p<1) requestAnimationFrame(tick); };
        requestAnimationFrame(tick);
        io.disconnect();
      }
    }, { threshold: .4 });
    io.observe(ref.current);
    return () => io.disconnect();
  }, [target]);
  return [v, ref];
}

// ── MARQUEE STRIP ─────────────────────────────────────────────────────────────
function Marquee() {
  const items = ['DEAD CONCRETE','BUILT RAW · BUILT HARD','RISE FROM THE CRACKS','STRENGTH · SURVIVAL · SHINE','STREET-BORN STREETWEAR'];
  const row = items.map((t,i) => <span key={'a'+i}>{t} <em>✦</em></span>);
  const row2 = items.map((t,i) => <span key={'b'+i}>{t} <em>✦</em></span>);
  return <div className="marquee" aria-hidden="true"><div className="marquee-track">{row}{row2}</div></div>;
}

// ── SPINNER ───────────────────────────────────────────────────────────────────
const Spin = () => <div className="spinner" />;

// ── TOAST SYSTEM ──────────────────────────────────────────────────────────────
const ToastContext = React.createContext();
function useToast() { return React.useContext(ToastContext); }
function ToastProvider({ children }) {
  const [toasts, setToasts] = React.useState([]);
  const add = (msg, type='success') => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.map(x => x.id===id ? {...x, removing:true} : x)), 2800);
    setTimeout(() => setToasts(t => t.filter(x => x.id!==id)), 3100);
  };
  return <ToastContext.Provider value={add}>{children}
    <div className="toast-container">{toasts.map(t => <div key={t.id} className={`toast toast-${t.type}${t.removing?' removing':''}`}><span style={{fontSize:16}}>{t.type==='success'?'✓':t.type==='error'?'✕':'ℹ'}</span><span style={{fontFamily:'Barlow',fontSize:14,color:'#ccc'}}>{t.msg}</span></div>)}</div>
  </ToastContext.Provider>;
}

// ── PRODUCT IMAGE ─────────────────────────────────────────────────────────────
function ProductImage({ src, alt, size=64, style={} }) {
  if (src) return <img src={src} alt={alt||'Product'} className="product-img" style={style} onError={e=>{e.target.style.display='none';e.target.nextSibling.style.display='flex';}} />;
  return <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:size,background:'linear-gradient(135deg,#1a1a1a,#c0392b22)',...style}}>🧱</div>;
}

// ── STARS ─────────────────────────────────────────────────────────────────────
function Stars({ rating, size=18, interactive=false, onRate }) {
  const [hover, setHover] = React.useState(0);
  return <div style={{display:'flex',gap:2}}>{[1,2,3,4,5].map(n => <span key={n} onClick={()=>interactive&&onRate(n)} onMouseEnter={()=>interactive&&setHover(n)} onMouseLeave={()=>interactive&&setHover(0)} style={{fontSize:size,cursor:interactive?'pointer':'default',color:n<=(hover||rating)?'#f39c12':'#333',transition:'color .15s'}}>★</span>)}</div>;
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [theme, setTheme] = useLocalStorage('dc_theme', 'dark');
  React.useEffect(() => { document.body.setAttribute('data-theme', theme); }, [theme]);
  const toggleTheme = () => setTheme(t => t==='dark'?'light':'dark');

  // Scroll progress + parallax CSS variable
  const [scrollPct, setScrollPct] = React.useState(0);
  React.useEffect(() => {
    let rafId = 0;
    const tick = () => {
      const total = document.documentElement.scrollHeight - window.innerHeight;
      const pct = total > 0 ? Math.min(100, (window.scrollY / total) * 100) : 0;
      setScrollPct(pct);
      document.documentElement.style.setProperty('--scroll-y', `${window.scrollY}px`);
      rafId = 0;
    };
    const onScroll = () => { if (!rafId) rafId = requestAnimationFrame(tick); };
    window.addEventListener('scroll', onScroll, { passive: true });
    tick();
    return () => { window.removeEventListener('scroll', onScroll); if (rafId) cancelAnimationFrame(rafId); };
  }, []);

  React.useEffect(() => {
    const pl = document.getElementById('dc-preloader');
    if (!pl) return;
    // Brief minimum show time so it doesn't flash, then fade out
    const t = setTimeout(() => {
      pl.classList.add('dc-hidden');
      setTimeout(() => pl.remove(), 700);
    }, 600);
    return () => clearTimeout(t);
  }, []);

  const [page, setPage] = React.useState(() => {
    const params = new URLSearchParams(window.location.search);
    return params.get('reset') ? 'reset' : 'home';
  });
  const [user, setUser] = useLocalStorage('dc_user', null);
  const [token, setToken] = useLocalStorage('dc_token', null);
  const [cart, setCart] = useLocalStorage('dc_cart', []);
  const [cartOpen, setCartOpen] = React.useState(false);
  const [pageData, setPageData] = React.useState(() => {
    const params = new URLSearchParams(window.location.search);
    const reset = params.get('reset');
    return reset ? { resetToken: reset } : {};
  });8 

  const nav = (p, data={}) => { setPage(p); setPageData(data); setCartOpen(false); window.scrollTo(0,0); };
  const cartCount = cart.reduce((s,i) => s+i.qty, 0);
  const cartTotal = cart.reduce((s,i) => s+i.price*i.qty, 0);

  const addToCart = (p, size, toast) => {
    const sz = size || null;
    const lineKey = `${p.id}__${sz||'-'}`;
    setCart(prev => {
      const ex = prev.find(i => i.lineKey === lineKey);
      return ex ? prev.map(i => i.lineKey===lineKey ? {...i, qty:i.qty+1} : i) : [...prev, {...p, size: sz, qty:1, lineKey}];
    });
    if (toast) toast(`${p.name}${sz?` · ${sz}`:''} added to cart`);
  };
  const updateQty = (lineKey, d) => setCart(prev => prev.map(i=>i.lineKey===lineKey?{...i,qty:Math.max(0,i.qty+d)}:i).filter(i=>i.qty>0));

  const logout = () => { setUser(null); setToken(null); nav('home'); };

  const ctx = { user, setUser, token, setToken, cart, cartTotal, cartCount, addToCart, updateQty, clearCart, setCartOpen, nav, logout, pageData, theme, toggleTheme };

// ── REVIEWS SECTION ───────────────────────────────────────────────────────────
function ReviewsSection({ productId }) {
  const [data, setData] = React.useState({reviews:[],avgRating:0,totalReviews:0});
  const [showForm, setShowForm] = React.useState(false);
  const [form, setForm] = React.useState({rating:0,title:'',body:''});
  const [loading, setLoading] = React.useState(true);
  const [submitting, setSubmitting] = React.useState(false);
  const [submitted, setSubmitted] = React.useState(false);
  const [error, setError] = React.useState('');
  const api = useApi();
  const token = localStorage.getItem('dc_token');

  React.useEffect(() => { api.get(`/reviews?productId=${productId}`).then(setData).catch(()=>{}).finally(()=>setLoading(false)); }, [productId]);

  const submit = async () => {
    if (!form.rating) { setError('Pick a star rating'); return; }
    setSubmitting(true); setError('');
    try { await api.post('/reviews', {productId,...form}); setSubmitted(true); setShowForm(false); }
    catch(e) { setError(e.message); }
    finally { setSubmitting(false); }
  };

  return (
    <div style={{marginTop:40,paddingTop:32,borderTop:'2px solid #1a1a1a'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:28,flexWrap:'wrap',gap:12}}>

          <span className="section-tag">REVIEWS</span>
          <div style={{display:'flex',alignItems:'baseline',gap:12}}>
            <span style={{fontWeight:900,fontSize:44,lineHeight:1}}>{data.avgRating||'—'}</span>
            <div><Stars rating={Math.round(data.avgRating)} size={18} /><div style={{color:'#555',fontFamily:'Barlow',fontSize:12,marginTop:3}}>{data.totalReviews} review{data.totalReviews!==1?'s':''}</div></div>
          </div>
        </div>
        {token&&!submitted&&<button className="btn btn-outline" onClick={()=>setShowForm(f=>!f)}>{showForm?'CANCEL':'+ WRITE REVIEW'}</button>}
        {!token&&<p style={{color:'#555',fontFamily:'Barlow',fontSize:13}}>Sign in to leave a review</p>}
      </div>
      {showForm&&<div className="card fade-up" style={{padding:28,marginBottom:24}}>
        <div style={{marginBottom:14}}><label className="label">Rating *</label><Stars rating={form.rating} size={26} interactive onRate={r=>setForm(f=>({...f,rating:r}))} /></div>
        <div style={{marginBottom:14}}><label className="label">Title</label><input className="input" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="Sum it up..." /></div>
        <div style={{marginBottom:14}}><label className="label">Review</label><textarea className="input" rows={3} value={form.body} onChange={e=>setForm(f=>({...f,body:e.target.value}))} placeholder="What did you think?" style={{resize:'vertical'}} /></div>
        {error&&<p style={{color:'#e74c3c',fontFamily:'Barlow',fontSize:13,marginBottom:12}}>{error}</p>}
        <button className="btn btn-primary" style={{padding:'11px 28px'}} onClick={submit} disabled={submitting}>{submitting?<Spin/>:'SUBMIT'}</button>
      </div>}
      {submitted&&<div style={{background:'#0a1a0f',border:'1px solid #27ae60',padding:'12px 18px',marginBottom:20,color:'#27ae60',fontFamily:'Barlow',fontSize:14}}>✓ Review submitted — pending approval.</div>}
      {loading?<div style={{textAlign:'center',padding:32}}><Spin/></div>
        :data.reviews.length===0?<p style={{color:'#444',fontFamily:'Barlow',fontSize:14}}>No reviews yet.</p>
        :data.reviews.map(r=>(
          <div key={r.id} className="card" style={{padding:22,marginBottom:14}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:8,flexWrap:'wrap',gap:8}}>
              <div><Stars rating={r.rating} size={15}/>{r.title&&<div style={{fontWeight:800,fontSize:16,marginTop:5}}>{r.title}</div>}</div>
              <div style={{textAlign:'right'}}><div style={{fontWeight:700,fontSize:13}}>{r.reviewer_name}</div><div style={{color:'#444',fontSize:11,fontFamily:'Barlow'}}>{r.created_at?.slice(0,10)}</div></div>

            {r.body&&<p style={{color:'#888',fontFamily:'Barlow',fontSize:14,lineHeight:1.7,margin:0}}>{r.body}</p>}

// ── CHECKOUT PAGE ─────────────────────────────────────────────────────────────
function CheckoutPage({ cart, cartTotal, clearCart, user, nav }) {
  const [step, setStep] = React.useState(1);
  const [orderId, setOrderId] = React.useState(null);
  const [payStatus, setPayStatus] = React.useState(''); // 'momo_pending' | 'bank_pending' | 'confirmed'
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');
  const [shipping, setShipping] = React.useState({name:user?.name||'',email:user?.email||'',phone:'',address:'',city:'',zip:''});
  const [payMethod, setPayMethod] = React.useState('momo');
  const [momoPhone, setMomoPhone] = React.useState('');
  const [momoNetwork, setMomoNetwork] = React.useState('mtn');
  const [momoDisplayText, setMomoDisplayText] = React.useState('');
  const [momoReference, setMomoReference] = React.useState('');
  const [otpRequired, setOtpRequired] = React.useState(false);
  const [otpValue, setOtpValue] = React.useState('');
  const [config, setConfig] = React.useState(null);
  const pollRef = React.useRef(null);
  const api = useApi();

  React.useEffect(() => {
    fetch('/api/config').then(r => r.json()).then(cfg => setConfig(cfg)).catch(() => {});
  }, []);

  React.useEffect(() => {
    return () => { if (pollRef.current) clearInterval(pollRef.current); };
  }, []);

  const startPolling = (reference) => {
    pollRef.current = setInterval(async () => {
      try {
        const { status } = await api.get(`/payments/verify/${reference}`);
        if (status === 'success') { clearInterval(pollRef.current); setPayStatus('confirmed'); }
      } catch {}
    }, 5000);
  };

  const submitOtp = async () => {
    if (!otpValue.trim()) { setError('Enter the OTP you received by SMS.'); return; }
    setLoading(true); setError('');
    try {
      const { paystackStatus, displayText } = await api.post('/payments/momo/otp', { reference: momoReference, otp: otpValue.trim() });
      setMomoDisplayText(displayText || 'Approve the MoMo prompt on your phone.');
      if (paystackStatus === 'success') {
        setPayStatus('confirmed');
      } else {
        setOtpRequired(false);
        setOtpValue('');
        setPayStatus('momo_pending');
        startPolling(momoReference);
      }
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  };

  const openPaystackPopup = async (channels) => {
    if (!config?.paystackPublicKey) { setError('Payment not ready — please refresh.'); return; }
    const method = channels?.[0] === 'mobile_money' ? 'momo' : channels?.[0] === 'card' ? 'card' : 'bank';
    const { orderId: oid, total } = await api.post('/payments/bank', {
      items: cart.map(i => ({ productId: i.id, quantity: i.qty, size: i.size||null })),
      shipping, guestEmail: shipping.email,
      paymentMethod: method,
    });
    const handler = PaystackPop.setup({
      key: config.paystackPublicKey,
      email: shipping.email,
      amount: Math.round(total * 100),
      currency: 'GHS',
      ref: oid,
      channels,
      metadata: { orderId: oid, customer_phone: momoPhone || shipping.phone },
      callback: (response) => {
        // Paystack popup handled the wallet auth (OTP/PIN); now verify on our server
        api.get(`/payments/verify/${response.reference}`).catch(()=>{});
        setOrderId(oid); setPayStatus('confirmed'); clearCart(); setLoading(false);
      },
      onClose: () => setLoading(false),
    });
    handler.openIframe();
  };

  const placeOrder = async () => {
    setLoading(true); setError('');
    try {
      if (payMethod === 'momo') {
        await openPaystackPopup(['mobile_money']);
        return;
      } else if (payMethod === 'bank') {
        const { orderId: oid } = await api.post('/payments/bank', {
          items: cart.map(i => ({ productId: i.id, quantity: i.qty, size: i.size||null })),
          shipping, guestEmail: shipping.email,
        });
        setOrderId(oid); setPayStatus('bank_pending'); clearCart();
      } else if (payMethod === 'card') {
        await openPaystackPopup(['card']);
        return;
      }
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  };

  const copyToClipboard = (text, label) => {
    try { navigator.clipboard.writeText(text); } catch {}
  };

  if (!cart.length && !orderId) return (
    <div style={{maxWidth:600,margin:'100px auto',padding:'40px 20px',textAlign:'center'}} className="fade-up">
      <div style={{fontSize:64,marginBottom:20,opacity:.5}}>🛒</div>
      <h2 style={{fontWeight:900,fontSize:40,letterSpacing:-1,marginBottom:12}}>NOTHING IN YOUR CART</h2>
      <p style={{color:'#666',fontFamily:'Barlow',marginBottom:28,fontSize:15}}>Add a Resurrection tee or Stand Top first — then come back to check out.</p>
      <button className="btn btn-primary" style={{padding:'14px 36px'}} onClick={()=>nav('shop')}>BROWSE PRODUCTS →</button>
    </div>
  );

  if (orderId) return (
    <div style={{maxWidth:640,margin:'60px auto',padding:20}} className="fade-up">
      {payStatus==='momo_otp' && (
        <div className="card" style={{padding:'48px 36px',textAlign:'center',borderTop:'4px solid #f7941d'}}>
          <div style={{width:96,height:96,background:'#1a1000',border:'3px solid #f7941d',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 28px',fontSize:42}}>🔐</div>

          <input

          <div style={{display:'flex',alignItems:'center',gap:10,justifyContent:'center',marginBottom:32,padding:'12px 18px',background:'#0d0d0d',border:'1px dashed #2a2a2a'}}>

// ── TRACK PAGE ────────────────────────────────────────────────────────────────
const STATUS_STEPS = ['Order Received','In Production','Quality Check','Shipped','Delivered'];

function TrackPage({ user }) {
  const [searchId, setSearchId] = React.useState('');
  const [order, setOrder] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');
  const api = useApi();

  const search = async () => {
    if (!searchId.trim()) return;
    setLoading(true); setError(''); setOrder(null);
    try { setOrder(await api.get(`/orders/track/${searchId.trim()}`)); }
    catch { setError('Order not found. Check your order ID.'); }
    finally { setLoading(false); }
  };

  return (
    <div style={{maxWidth:860,margin:'0 auto',padding:'60px 20px'}}>
      <span className="section-tag">REAL-TIME UPDATES</span>
      <h1 className="resp-h1" style={{fontWeight:900,fontSize:64,letterSpacing:-2,lineHeight:1,marginBottom:48}}>TRACK<br/>YOUR ORDER</h1>
      <div className="card" style={{padding:36,marginBottom:48}}>
        <p style={{color:'#666',fontFamily:'Barlow',marginBottom:20}}>Enter your order ID from your confirmation. <strong style={{color:'#fff'}}>Try: ORD-2800</strong></p>
        <div style={{display:'flex',gap:12}}>
          <input className="input" placeholder="e.g. ORD-2800" value={searchId} onChange={e=>setSearchId(e.target.value)} onKeyDown={e=>e.key==='Enter'&&search()} style={{flex:1}} />
          <button className="btn btn-primary" style={{padding:'12px 28px'}} onClick={search} disabled={loading}>{loading?<Spin/>:'TRACK'}</button>
        </div>
        {error&&<p style={{color:'#e74c3c',fontFamily:'Barlow',fontSize:14,marginTop:12}}>{error}</p>}
      </div>
      {order&&<OrderCard order={order} />}
    </div>
  );
}

function OrderCard({ order }) {
  const stepIdx = STATUS_STEPS.indexOf(order.status);
  const cancelled = order.status==='Cancelled';
  const statusColor = cancelled?'#e74c3c':order.status==='Delivered'?'#27ae60':'#f39c12';
  return (
    <div className="card fade-up" style={{padding:36}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:32,flexWrap:'wrap',gap:16}}>
        <div>
          <div style={{fontWeight:900,fontSize:26,letterSpacing:1}}>{order.id}</div>
          <div style={{color:'#555',fontSize:13,marginTop:4,fontFamily:'Barlow'}}>Placed {order.created_at?.slice(0,10)}</div>
          {order.items?.length>0&&<div style={{marginTop:8,color:'#888',fontFamily:'Barlow',fontSize:13}}>{order.items.map(i=>`${i.product_name}${i.size?` (${i.size})`:''} ×${i.quantity}`).join(', ')}</div>}
          {order.tracking_number&&<div style={{marginTop:8,fontSize:13,fontFamily:'Barlow'}}>📦 Tracking: <span style={{color:'#c0392b',fontWeight:700}}>{order.tracking_number}</span></div>}
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontWeight:900,fontSize:30,color:'#c0392b'}}>GHS {order.total?.toFixed(2)}</div>
          <span style={{display:'inline-block',marginTop:8,padding:'4px 14px',fontSize:10,fontWeight:900,letterSpacing:2,border:`1px solid ${statusColor}`,color:statusColor}}>{order.status?.toUpperCase()}</span>
        </div>
      </div>
      {!cancelled&&<div style={{position:'relative',paddingBottom:40}}>
        <div style={{position:'absolute',top:16,left:20,right:20,height:2,background:'#1e1e1e'}} />
        <div style={{position:'absolute',top:16,left:20,height:2,background:'#c0392b',width:`${(Math.max(0,stepIdx)/(STATUS_STEPS.length-1))*88}%`,transition:'width .8s ease'}} />
        <div style={{display:'flex',justifyContent:'space-between',position:'relative'}}>
          {STATUS_STEPS.map((s,i)=>(
            <div key={s} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:10}}>
              <div style={{width:32,height:32,borderRadius:'50%',background:i<=stepIdx?'#c0392b':'#1e1e1e',border:`2px solid ${i<=stepIdx?'#c0392b':'#333'}`,display:'flex',alignItems:'center',justifyContent:'center',zIndex:1,transition:'all .4s'}}>
                {i<stepIdx?'✓':i===stepIdx?'●':''}
              </div>
              <span className="track-step-label" style={{fontWeight:800,letterSpacing:1.5,color:i<=stepIdx?'#fff':'#444',textAlign:'center',maxWidth:70}}>{s.toUpperCase()}</span>
            </div>
          ))}
        </div>
      </div>}
      {order.history?.length>0&&<div style={{marginTop:8,borderTop:'1px solid #1a1a1a',paddingTop:20}}>
        <div className="label" style={{marginBottom:12}}>STATUS HISTORY</div>
        {order.history.map((h,i)=><div key={i} style={{display:'flex',gap:16,marginBottom:10,fontFamily:'Barlow',fontSize:13}}><span style={{color:'#444'}}>{h.created_at?.slice(0,10)}</span><span style={{color:'#888'}}>{h.status}</span>{h.note&&<span style={{color:'#555'}}>— {h.note}</span>}</div>)}
      </div>}
    </div>
  );
}

// ── RESET PASSWORD PAGE ───────────────────────────────────────────────────────
function ResetPasswordPage({ pageData, nav }) {
  const [password, setPassword] = React.useState('');
  const [confirm, setConfirm]   = React.useState('');
  const [loading, setLoading]   = React.useState(false);
  const [error, setError]       = React.useState('');
  const [done, setDone]         = React.useState(false);
  const api = useApi();
  const token = pageData?.resetToken;

  const submit = async () => {
    setError('');
    if (password.length < 6) { setError('Password must be at least 6 characters'); return; }
    if (password !== confirm) { setError('Passwords do not match'); return; }
    setLoading(true);
    try {
      await api.post('/auth/reset-password', { token, password });
      setDone(true);
      window.history.replaceState({}, '', '/');
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  };

  if (!token) return (
    <div style={{maxWidth:480,margin:'80px auto',padding:20,textAlign:'center'}}>
      <h1 style={{fontWeight:900,fontSize:40,letterSpacing:-1,marginBottom:16}}>NO RESET TOKEN</h1>
      <p style={{color:'#666',fontFamily:'Barlow',marginBottom:24}}>This page needs a reset link from your email.</p>
      <button className="btn btn-primary" onClick={()=>nav('account')}>BACK TO SIGN IN</button>
    </div>
  );

  return (
    <div style={{maxWidth:480,margin:'80px auto',padding:20}}>
      <span className="section-tag">RESET PASSWORD</span>
      <h1 style={{fontWeight:900,fontSize:48,letterSpacing:-1,marginBottom:40}}>SET A NEW PASSWORD</h1>
      <div className="card resp-pad" style={{padding:40}}>
        {done ? <>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:48,marginBottom:16}}>✓</div>
            <h3 style={{fontWeight:900,fontSize:22,marginBottom:12}}>PASSWORD UPDATED</h3>
            <p style={{color:'#666',fontFamily:'Barlow',marginBottom:24}}>You can now sign in with your new password.</p>
            <button className="btn btn-primary" style={{width:'100%',padding:'14px'}} onClick={()=>nav('account')}>GO TO SIGN IN</button>
          </div>
        </> : <>
          <div style={{display:'grid',gap:20}}>
            <div><label className="label">New Password</label><input className="input" type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} /></div>
            <div><label className="label">Confirm Password</label><input className="input" type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} /></div>
          </div>
          {error&&<p style={{color:'#e74c3c',fontFamily:'Barlow',fontSize:14,marginTop:14}}>{error}</p>}
          <button className="btn btn-primary" style={{width:'100%',padding:'16px',marginTop:24,fontSize:16}} onClick={submit} disabled={loading}>{loading?<Spin/>:'UPDATE PASSWORD'}</button>
        </>}
      </div>
    </div>
  );
}

// ── ACCOUNT PAGE ──────────────────────────────────────────────────────────────
function AccountPage({ user, setUser, setToken, nav }) {
  const [mode, setMode] = React.useState('login'); // 'login' | 'register' | 'forgot'
  const [tab, setTab] = React.useState('orders');
  const [form, setForm] = React.useState({name:'',email:'',password:'',phone:''});
  const [profile, setProfile] = React.useState({});
  const [orders, setOrders] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');
  const [info, setInfo] = React.useState('');
  const [saved, setSaved] = React.useState(false);
  const [googleClientId, setGoogleClientId] = React.useState(null);
  const googleBtnRef = React.useRef(null);
  const api = useApi();

  React.useEffect(() => { api.get('/config').then(c => setGoogleClientId(c.googleClientId)).catch(()=>{}); }, []);

  // Render Google Sign-In button once GIS script + client ID are both ready
  React.useEffect(() => {
    if (user || !googleClientId || !googleBtnRef.current) return;
    const tryRender = () => {
      if (!window.google?.accounts?.id) return false;
      window.google.accounts.id.initialize({
        client_id: googleClientId,
        callback: async (response) => {
          setLoading(true); setError('');
          try {
            const { token, user: u } = await api.post('/auth/google', { credential: response.credential });
            localStorage.setItem('dc_token', token);
            setToken(token); setUser(u);
          } catch (e) { setError(e.message); }
          finally { setLoading(false); }
        },
      });
      googleBtnRef.current.innerHTML = '';
      window.google.accounts.id.renderButton(googleBtnRef.current, {
        theme: 'filled_black', size: 'large', shape: 'rectangular', text: mode==='register'?'signup_with':'signin_with', width: 320,
      });
      return true;
    };
    if (!tryRender()) {
      const iv = setInterval(() => { if (tryRender()) clearInterval(iv); }, 200);
      return () => clearInterval(iv);
    }
  }, [googleClientId, mode, user]);

  React.useEffect(() => {
    if (user) {
      setProfile({name:user.name,phone:user.phone||'',address:user.address||'',city:user.city||'',zip:user.zip||''});
      api.get('/orders/my').then(setOrders).catch(()=>{});
    }
  }, [user]);

  const handleAuth = async () => {
    setLoading(true); setError(''); setInfo('');
    try {
      if (mode==='forgot') {
        await api.post('/auth/forgot-password', { email: form.email });
        setInfo('If an account exists for that email, a reset link is on its way. Check your inbox (and spam).');
      } else {
        const endpoint = mode==='login'?'/auth/login':'/auth/register';
        const body = mode==='login'?{email:form.email,password:form.password}:{name:form.name,email:form.email,password:form.password,phone:form.phone};
        const { token, user: u } = await api.post(endpoint, body);
        localStorage.setItem('dc_token', token);
        setToken(token); setUser(u);
      }
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  };

  const switchMode = (next) => { setMode(next); setError(''); setInfo(''); };

  const saveProfile = async () => {
    setLoading(true);
    try { const u = await api.put('/auth/profile', profile); setUser(u); setSaved(true); setTimeout(()=>setSaved(false),2000); }
    catch(e) { setError(e.message); }
    finally { setLoading(false); }
  };

  if (!user) {
    const title = mode==='login'?'SIGN IN':mode==='register'?'CREATE ACCOUNT':'FORGOT PASSWORD';
    const cta   = mode==='login'?'SIGN IN':mode==='register'?'CREATE ACCOUNT':'SEND RESET LINK';
    return (
      <div style={{maxWidth:480,margin:'80px auto',padding:20}}>
        <span className="section-tag">CUSTOMER PORTAL</span>
        <h1 className="resp-h1" style={{fontWeight:900,fontSize:52,letterSpacing:-1,marginBottom:40}}>{title}</h1>
        <div className="card resp-pad" style={{padding:40}}>
          <div style={{display:'grid',gap:20}}>
            {mode==='register'&&<><div><label className="label">Full Name</label><input className="input" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} /></div><div><label className="label">Phone (optional)</label><input className="input" value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value}))} /></div></>}
            <div><label className="label">Email</label><input className="input" type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} onKeyDown={e=>e.key==='Enter'&&handleAuth()} /></div>
            {mode!=='forgot'&&<div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                <label className="label">Password</label>
                {mode==='login'&&<span onClick={()=>switchMode('forgot')} style={{color:'#c0392b',cursor:'pointer',fontWeight:700,fontSize:10,letterSpacing:1.5,textTransform:'uppercase'}}>Forgot?</span>}
              </div>
              <input className="input" type="password" value={form.password} onChange={e=>setForm(f=>({...f,password:e.target.value}))} onKeyDown={e=>e.key==='Enter'&&handleAuth()} />
            </div>}
          </div>
          {error&&<p style={{color:'#e74c3c',fontFamily:'Barlow',fontSize:14,marginTop:14}}>{error}</p>}
          {info&&<p style={{color:'#27ae60',fontFamily:'Barlow',fontSize:14,marginTop:14}}>{info}</p>}
          <button className="btn btn-primary" style={{width:'100%',padding:'16px',marginTop:24,fontSize:16}} onClick={handleAuth} disabled={loading}>{loading?<Spin/>:cta}</button>
          {googleClientId && mode!=='forgot' && <>
            <div style={{display:'flex',alignItems:'center',gap:12,margin:'24px 0 18px',color:'#333',fontFamily:'Barlow',fontSize:11,letterSpacing:2}}>
              <div style={{flex:1,height:1,background:'#1e1e1e'}} /> OR <div style={{flex:1,height:1,background:'#1e1e1e'}} />
            </div>
            <div ref={googleBtnRef} style={{display:'flex',justifyContent:'center'}} />
          </>}
          <p style={{textAlign:'center',marginTop:20,color:'#555',fontFamily:'Barlow',fontSize:14}}>
            {mode==='login' && <>No account? <span onClick={()=>switchMode('register')} style={{color:'#c0392b',cursor:'pointer',fontWeight:700}}>Register</span></>}
            {mode==='register' && <>Have one? <span onClick={()=>switchMode('login')} style={{color:'#c0392b',cursor:'pointer',fontWeight:700}}>Sign In</span></>}
            {mode==='forgot' && <>Remembered it? <span onClick={()=>switchMode('login')} style={{color:'#c0392b',cursor:'pointer',fontWeight:700}}>Back to Sign In</span></>}
          </p>
        </div>
      </div>
    );
  }

  return (
    <div style={{maxWidth:900,margin:'0 auto',padding:'60px 20px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:48,flexWrap:'wrap',gap:16}}>
        <div><span className="section-tag">WELCOME BACK</span><h1 className="resp-account-h1 resp-h1" style={{fontWeight:900,fontSize:52,letterSpacing:-1}}>{user.name.toUpperCase()}</h1><div style={{color:'#555',fontFamily:'Barlow',marginTop:4}}>{user.email}</div></div>
        <div style={{display:'flex',gap:10}}>
          {user.role==='admin'&&<button className="btn btn-outline" onClick={()=>nav('admin')}>ADMIN PANEL</button>}
        </div>
      </div>
      <div style={{display:'flex',gap:0,marginBottom:40,borderBottom:'2px solid #1e1e1e'}}>
        {[['orders','MY ORDERS'],['details','ACCOUNT DETAILS']].map(([t,l])=><button key={t} onClick={()=>setTab(t)} className="btn" style={{padding:'14px 28px',color:tab===t?'#fff':'#555',borderBottom:tab===t?'3px solid #c0392b':'3px solid transparent',marginBottom:-2,background:'none'}}>{l}</button>)}
      </div>
      {tab==='orders'&&<div>
        {orders.length===0?<div style={{textAlign:'center',padding:'60px 0',color:'#444'}}><div style={{fontSize:48}}>📦</div><p style={{fontFamily:'Barlow',marginTop:16}}>No orders yet.</p><button className="btn btn-primary" style={{marginTop:20}} onClick={()=>nav('shop')}>SHOP NOW</button></div>
          :orders.map(o=>(
            <div key={o.id} className="card" style={{padding:24,marginBottom:14,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:16}}>
              <div><div style={{fontWeight:900,fontSize:18,letterSpacing:1}}>{o.id}</div><div style={{color:'#555',fontSize:12,fontFamily:'Barlow',marginTop:4}}>{o.created_at?.slice(0,10)} · {o.items?.map(i=>`${i.product_name}${i.size?` (${i.size})`:''}`).join(', ')}</div></div>
              <div style={{display:'flex',alignItems:'center',gap:14}}>
                <span style={{padding:'4px 12px',fontSize:10,fontWeight:900,letterSpacing:2,border:`1px solid ${o.status==='Delivered'?'#27ae60':'#f39c12'}`,color:o.status==='Delivered'?'#27ae60':'#f39c12'}}>{o.status?.toUpperCase()}</span>
                <span style={{fontWeight:900,fontSize:22,color:'#c0392b'}}>GHS {o.total?.toFixed(2)}</span>
              </div>
            </div>
          ))
        }
      </div>}
      {tab==='details'&&<div className="card" style={{padding:40,maxWidth:520}}>
        <h3 style={{fontWeight:900,fontSize:24,marginBottom:28,letterSpacing:1}}>UPDATE DETAILS</h3>
        <div style={{display:'grid',gap:20}}>
          {[['name','Full Name'],['phone','Phone'],['address','Street Address'],['city','City'],['zip','ZIP']].map(([k,l])=><div key={k}><label className="label">{l}</label><input className="input" value={profile[k]||''} onChange={e=>setProfile(p=>({...p,[k]:e.target.value}))} /></div>)}
        </div>
        {error&&<p style={{color:'#e74c3c',fontFamily:'Barlow',fontSize:14,marginTop:14}}>{error}</p>}
        <button className="btn btn-primary" style={{marginTop:28,padding:'14px 36px',fontSize:15}} onClick={saveProfile} disabled={loading}>{loading?<Spin/>:saved?'✓ SAVED':'SAVE CHANGES'}</button>
      </div>}
    </div>
  );
}

// ── ADMIN PAGE ────────────────────────────────────────────────────────────────
const STATUS_OPTIONS = ['Order Received','In Production','Quality Check','Shipped','Delivered','Cancelled'];
const STATUS_COLORS = {'Order Received':'#3498db','In Production':'#e67e22','Quality Check':'#9b59b6','Shipped':'#1abc9c','Delivered':'#27ae60','Cancelled':'#e74c3c'};

function AdminPage({ user, nav }) {
  const [tab, setTab] = React.useState('dashboard');
  const [stats, setStats] = React.useState(null);
  const [orders, setOrders] = React.useState([]);
  const [products, setProducts] = React.useState([]);
  const [quotes, setQuotes] = React.useState([]);
  const [pending, setPending] = React.useState([]);
  const [selected, setSelected] = React.useState(null);
  const [newStatus, setNewStatus] = React.useState('');
  const [statusNote, setStatusNote] = React.useState('');
  const [trackingNum, setTrackingNum] = React.useState('');
  const [newProd, setNewProd] = React.useState({name:'',category:'resurrection',price:'',description:'',badge:'',sizes:'S,M,L,XL,XXL'});
  const [newProdImg, setNewProdImg] = React.useState(null);
  const [editProd, setEditProd] = React.useState(null);
  const [editProdImg, setEditProdImg] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const api = useApi();
  const toast = useToast();

  const authHeaders = () => ({ Authorization: `Bearer ${localStorage.getItem('dc_token')}` });

  const purgeDemo = async () => {
    if (!window.confirm('Delete demo users, orders and example quotes? This cannot be undone.')) return;
    setLoading(true);
    try {
      const result = await api.del('/admin/demo-cleanup');
      toast(`${result.deletedUsers || 0} demo user(s) removed`, 'success');
      load();
    } catch(e) {
      toast(`Cleanup failed: ${e.message}`, 'error');
    } finally {
      setLoading(false);
    }
  };

  React.useEffect(() => { if (!user||user.role!=='admin') { nav('account'); return; } load(); }, [user]);

  const load = async () => {
    setLoading(true);
    try {
      const [s,o,p,q,r] = await Promise.all([api.get('/admin/stats'),api.get('/orders'),api.get('/products'),api.get('/contact'),api.get('/reviews/pending')]);
      setStats(s); setOrders(o.orders||[]); setProducts(p); setQuotes(Array.isArray(q)?q:[]); setPending(Array.isArray(r)?r:[]);
    } catch(e) { console.error(e); }
    finally { setLoading(false); }
  };

  const updateStatus = async () => {
    if (!newStatus||!selected) return;
    await api.patch(`/orders/${selected.id}/status`,{status:newStatus,note:statusNote,trackingNumber:trackingNum});
    setSelected(null); setNewStatus(''); setStatusNote(''); setTrackingNum(''); load();
  };

  const verifyMomo = async (order) => {
    if (!window.confirm(`Confirm MoMo payment verified for ${order.id}?\n\nRef: ${order.notes}\n\nThis will mark the order as confirmed and send a confirmation email to the customer.`)) return;
    try {
      await api.patch(`/orders/${order.id}/status`, { status: 'Order Received', verifyMomo: true, note: 'MoMo payment verified' });
      toast('MoMo payment verified — order confirmed!', 'success');
      load();
    } catch(e) { toast(e.message, 'error'); }
  };

  const addProduct = async () => {
    if (!newProd.name||!newProd.price) { toast('Name and price required','error'); return; }
    const fd = new FormData();
    Object.entries({...newProd, price: parseFloat(newProd.price)}).forEach(([k,v]) => { if (v!==''&&v!=null) fd.append(k,v); });
    if (newProdImg) fd.append('image', newProdImg);
    try {
      const res = await fetch('/api/products', { method:'POST', headers: authHeaders(), body: fd });
      if (!res.ok) { const d = await res.json(); toast(d.error||'Failed','error'); return; }
      setNewProd({name:'',category:'tops',price:'',description:'',badge:''}); setNewProdImg(null); load(); toast('Product added','success');
    } catch(e) { toast(e.message,'error'); }
  };

  const saveEditProduct = async () => {
    if (!editProd||!editProd.name||!editProd.price) { toast('Name and price required','error'); return; }
    const fd = new FormData();
    ['name','category','price','description','badge','accent_color','in_stock','sizes'].forEach(k => { if (editProd[k]!==undefined&&editProd[k]!==null) fd.append(k, editProd[k]); });
    if (editProdImg) fd.append('image', editProdImg);
    try {
      const res = await fetch(`/api/products/${editProd.id}`, { method:'PUT', headers: authHeaders(), body: fd });
      if (!res.ok) { const d = await res.json(); toast(d.error||'Failed','error'); return; }
      setEditProd(null); setEditProdImg(null); load(); toast('Product updated','success');
    } catch(e) { toast(e.message,'error'); }
  };

  const toggleStock = async (p) => {
    const fd = new FormData();
    ['name','category','description','badge','accent_color'].forEach(k => { if (p[k]) fd.append(k, p[k]); });
    fd.append('price', p.price); fd.append('in_stock', p.in_stock ? '0' : '1');
    try {
      await fetch(`/api/products/${p.id}`, { method:'PUT', headers: authHeaders(), body: fd });
      load(); toast(p.in_stock ? 'Product hidden' : 'Product visible', 'success');
    } catch(e) { toast(e.message,'error'); }
  };

  const TABS = [['dashboard','OVERVIEW'],['orders','ORDERS'],['products','PRODUCTS'],['quotes',`QUOTES${quotes.filter(q=>q.status==='new').length?` (${quotes.filter(q=>q.status==='new').length})`:''}`],['reviews',`REVIEWS${pending.length?` (${pending.length})`:''}`]];

  if (!user||user.role!=='admin') return null;

  return (
    <div style={{maxWidth:1200,margin:'0 auto',padding:'60px 20px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:48}}>
        <div><span className="section-tag">ADMIN PANEL</span><h1 className="resp-h1" style={{fontWeight:900,fontSize:52,letterSpacing:-1}}>DASHBOARD</h1></div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-outline" onClick={purgeDemo} disabled={loading}>{loading?<Spin/>:'Purge DEMO DATA'}</button>
          <button className="btn btn-outline" onClick={load} disabled={loading}>{loading?<Spin/>:'↺ REFRESH'}</button>
        </div>
      </div>
      <div style={{display:'flex',gap:0,marginBottom:40,borderBottom:'2px solid #1e1e1e',overflowX:'auto'}}>
        {TABS.map(([t,l])=><button key={t} onClick={()=>setTab(t)} className="btn" style={{padding:'14px 22px',color:tab===t?'#fff':'#555',borderBottom:tab===t?'3px solid #c0392b':'3px solid transparent',marginBottom:-2,background:'none',whiteSpace:'nowrap'}}>{l}</button>)}
      </div>

      {tab==='dashboard'&&stats&&<div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:20,marginBottom:48}}>
          {[['REVENUE',`$${stats.totalRevenue?.toFixed(2)}`,'#c0392b'],['ORDERS',stats.totalOrders,'#e67e22'],['IN PROGRESS',stats.pendingOrders,'#3498db'],['CUSTOMERS',stats.totalCustomers,'#27ae60']].map(([l,v,c])=><div key={l} className="card" style={{padding:28,borderTop:`3px solid ${c}`}}><div className="label">{l}</div><div style={{fontWeight:900,fontSize:40,color:c,lineHeight:1}}>{v}</div></div>)}
          {stats.momoAwating>0&&<div className="card" style={{padding:28,borderTop:'3px solid #f7941d',cursor:'pointer'}} onClick={()=>setTab('orders')}><div className="label">MOMO PENDING</div><div style={{fontWeight:900,fontSize:40,color:'#f7941d',lineHeight:1}}>{stats.momoAwating}</div><div style={{color:'#666',fontFamily:'Barlow',fontSize:11,marginTop:6}}>Tap to verify</div></div>}
        </div>
        <div className="resp-2col" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
          <div className="card" style={{padding:28}}><h3 style={{fontWeight:900,fontSize:18,marginBottom:20,letterSpacing:1}}>BY STATUS</h3>{stats.byStatus?.map(r=><div key={r.status} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}><span style={{fontFamily:'Barlow',color:'#aaa',fontSize:14}}>{r.status}</span><div style={{display:'flex',alignItems:'center',gap:10}}><div style={{width:80,height:6,background:'#1e1e1e',borderRadius:3,overflow:'hidden'}}><div style={{height:'100%',background:STATUS_COLORS[r.status]||'#888',width:`${(r.count/Math.max(stats.totalOrders,1))*100}%`}} /></div><span style={{fontWeight:800,fontSize:14}}>{r.count}</span></div></div>)}</div>
          <div className="card" style={{padding:28}}><h3 style={{fontWeight:900,fontSize:18,marginBottom:20,letterSpacing:1}}>RECENT ORDERS</h3>{stats.recentOrders?.map(o=><div key={o.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,paddingBottom:14,borderBottom:'1px solid #1a1a1a'}}><div><div style={{fontWeight:800,fontSize:14}}>{o.id}</div><div style={{color:'#555',fontSize:12,fontFamily:'Barlow'}}>{o.customer_name||'Guest'}</div></div><div style={{textAlign:'right'}}><div style={{fontWeight:800,color:'#c0392b'}}>${o.total?.toFixed(2)}</div><div style={{fontSize:10,color:STATUS_COLORS[o.status]||'#888',fontWeight:700}}>{o.status?.toUpperCase()}</div></div></div>)}</div>
        </div>
      </div>}

      {tab==='orders'&&<div>
        {selected&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.85)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
          <div className="card" style={{width:'100%',maxWidth:500,padding:36}}>
            <h3 style={{fontWeight:900,fontSize:22,marginBottom:24}}>UPDATE: {selected.id}</h3>
            {selected.stripe_payment_status==='momo_pending'&&(
              <div style={{background:'#1a0f00',border:'1px solid #f7941d',padding:'12px 16px',marginBottom:20,borderRadius:4}}>
                <div style={{fontSize:10,letterSpacing:2,color:'#f7941d',marginBottom:6}}>MOMO REFERENCE</div>
                <div style={{fontWeight:800,color:'#fff',wordBreak:'break-all'}}>{selected.notes}</div>
                <p style={{color:'#aaa',fontFamily:'Barlow',fontSize:12,margin:'8px 0 0'}}>Verify this reference in your MTN wallet before confirming.</p>
              </div>
            )}
            <div style={{marginBottom:16}}><label className="label">New Status</label><select className="input" value={newStatus} onChange={e=>setNewStatus(e.target.value)}><option value="">Select...</option>{STATUS_OPTIONS.map(s=><option key={s}>{s}</option>)}</select></div>
            <div style={{marginBottom:16}}><label className="label">Tracking Number (optional)</label><input className="input" value={trackingNum} onChange={e=>setTrackingNum(e.target.value)} placeholder="1Z999AA1..." /></div>
            <div style={{marginBottom:24}}><label className="label">Note (optional)</label><input className="input" value={statusNote} onChange={e=>setStatusNote(e.target.value)} placeholder="e.g. Curing complete" /></div>
            <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
              <button className="btn btn-outline" onClick={()=>setSelected(null)}>CANCEL</button>
              {selected.stripe_payment_status==='momo_pending'&&(
                <button style={{flex:1,padding:'10px',background:'#f7941d',color:'#000',fontWeight:900,fontSize:12,letterSpacing:1,border:'none',cursor:'pointer'}} onClick={()=>{setSelected(null);verifyMomo(selected);}}>✓ VERIFY MOMO PAYMENT</button>
              )}
              <button className="btn btn-primary" style={{flex:1}} onClick={updateStatus}>UPDATE STATUS</button>
            </div>
          </div>
        </div>}
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{borderBottom:'2px solid #1e1e1e'}}>{['Order','Customer','Date','Total','Status','Payment','Action'].map(h=><th key={h} style={{padding:'12px 16px',textAlign:'left',fontSize:10,fontWeight:800,letterSpacing:2,color:'#555'}}>{h}</th>)}</tr></thead>
            <tbody>{orders.map(o=><tr key={o.id} style={{borderBottom:'1px solid #1a1a1a',background:o.stripe_payment_status==='momo_pending'?'#0d0a00':'transparent'}}>
              <td style={{padding:'16px',fontWeight:800}}>{o.id}</td>
              <td style={{padding:'16px',fontFamily:'Barlow',color:'#aaa',fontSize:14}}>{o.customer_name||o.guest_email||'Guest'}</td>
              <td style={{padding:'16px',fontFamily:'Barlow',color:'#666',fontSize:13}}>{o.created_at?.slice(0,10)}</td>
              <td style={{padding:'16px',fontWeight:800,color:'#c0392b'}}>GHS {o.total?.toFixed(2)}</td>
              <td style={{padding:'16px'}}><span style={{padding:'4px 10px',fontSize:9,fontWeight:900,letterSpacing:1.5,color:STATUS_COLORS[o.status]||'#888',border:`1px solid ${STATUS_COLORS[o.status]||'#888'}`}}>{o.status?.toUpperCase()}</span></td>
              <td style={{padding:'16px'}}>
                {o.stripe_payment_status==='momo_pending'&&<span style={{padding:'3px 8px',fontSize:9,fontWeight:900,letterSpacing:1,color:'#f7941d',border:'1px solid #f7941d'}}>📱 MOMO</span>}
                {o.stripe_payment_status==='momo_verified'&&<span style={{padding:'3px 8px',fontSize:9,fontWeight:900,letterSpacing:1,color:'#27ae60',border:'1px solid #27ae60'}}>✓ MOMO</span>}
                {o.stripe_payment_status==='succeeded'&&<span style={{padding:'3px 8px',fontSize:9,fontWeight:900,letterSpacing:1,color:'#3498db',border:'1px solid #3498db'}}>💳 CARD</span>}
              </td>
              <td style={{padding:'16px',display:'flex',gap:6,flexWrap:'wrap'}}>
                {o.stripe_payment_status==='momo_pending'&&<button style={{padding:'6px 10px',background:'#f7941d',color:'#000',fontWeight:900,fontSize:10,border:'none',cursor:'pointer',letterSpacing:1}} onClick={()=>verifyMomo(o)}>VERIFY</button>}
                <button className="btn btn-outline" style={{padding:'6px 14px',fontSize:11}} onClick={()=>{setSelected(o);setNewStatus(o.status);}}>UPDATE</button>
              </td>
            </tr>)}</tbody>
          </table>
        </div>
      </div>}

      {tab==='products'&&<div>
        {/* Edit product modal */}
        {editProd&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.88)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
          <div className="card" style={{width:'100%',maxWidth:560,padding:36,maxHeight:'90vh',overflowY:'auto'}}>
            <h3 style={{fontWeight:900,fontSize:22,marginBottom:24,letterSpacing:1}}>EDIT: {editProd.name}</h3>
            <div className="resp-2col" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
              <div><label className="label">Name</label><input className="input" value={editProd.name} onChange={e=>setEditProd(p=>({...p,name:e.target.value}))} /></div>
              <div><label className="label">Price (GHS)</label><input className="input" type="number" value={editProd.price} onChange={e=>setEditProd(p=>({...p,price:e.target.value}))} /></div>
              <div><label className="label">Badge</label><input className="input" value={editProd.badge||''} onChange={e=>setEditProd(p=>({...p,badge:e.target.value}))} placeholder="e.g. NEW" /></div>
              <div><label className="label">Category</label><select className="input" value={editProd.category} onChange={e=>setEditProd(p=>({...p,category:e.target.value}))}>{['resurrection','tops'].map(c=><option key={c}>{c}</option>)}</select></div>
              <div style={{gridColumn:'1/-1'}}><label className="label">Description</label><input className="input" value={editProd.description||''} onChange={e=>setEditProd(p=>({...p,description:e.target.value}))} /></div>
              <div style={{gridColumn:'1/-1'}}><label className="label">Sizes (comma-separated)</label><input className="input" value={editProd.sizes||''} onChange={e=>setEditProd(p=>({...p,sizes:e.target.value}))} placeholder="e.g. S,M,L,XL,XXL" /></div>
              <div style={{gridColumn:'1/-1'}}>
                <label className="label">Replace Image (optional)</label>
                <input type="file" accept="image/*" className="input" style={{padding:'8px 12px',cursor:'pointer'}} onChange={e=>setEditProdImg(e.target.files[0]||null)} />
                {editProd.image_url&&!editProdImg&&<div style={{marginTop:8,display:'flex',alignItems:'center',gap:10}}><img src={editProd.image_url} alt="" style={{width:60,height:60,objectFit:'cover',border:'1px solid #333'}} /><span style={{color:'#555',fontFamily:'Barlow',fontSize:12}}>Current image</span></div>}
              </div>
            </div>
            <div style={{display:'flex',gap:12,marginTop:24}}>
              <button className="btn btn-outline" onClick={()=>{setEditProd(null);setEditProdImg(null);}}>CANCEL</button>
              <button className="btn btn-primary" style={{flex:1}} onClick={saveEditProduct}>SAVE CHANGES</button>
            </div>
          </div>
        </div>}

        {/* Add product form */}
        <div className="card" style={{padding:32,marginBottom:32}}>
          <h3 style={{fontWeight:900,fontSize:20,marginBottom:24,letterSpacing:1}}>ADD NEW PRODUCT</h3>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:18}}>
            <div><label className="label">Name</label><input className="input" value={newProd.name} onChange={e=>setNewProd(p=>({...p,name:e.target.value}))} /></div>
            <div><label className="label">Price (GHS)</label><input className="input" type="number" value={newProd.price} onChange={e=>setNewProd(p=>({...p,price:e.target.value}))} /></div>
            <div><label className="label">Badge</label><input className="input" value={newProd.badge} onChange={e=>setNewProd(p=>({...p,badge:e.target.value}))} placeholder="e.g. NEW" /></div>
            <div><label className="label">Category</label><select className="input" value={newProd.category} onChange={e=>setNewProd(p=>({...p,category:e.target.value}))}>{['resurrection','tops'].map(c=><option key={c}>{c}</option>)}</select></div>
            <div style={{gridColumn:'1/-1'}}><label className="label">Description</label><input className="input" value={newProd.description} onChange={e=>setNewProd(p=>({...p,description:e.target.value}))} /></div>
            <div style={{gridColumn:'1/-1'}}><label className="label">Sizes (comma-separated)</label><input className="input" value={newProd.sizes} onChange={e=>setNewProd(p=>({...p,sizes:e.target.value}))} placeholder="e.g. S,M,L,XL,XXL" /></div>
            <div style={{gridColumn:'1/-1'}}>
              <label className="label">Product Image (optional)</label>
              <input type="file" accept="image/*" className="input" style={{padding:'8px 12px',cursor:'pointer'}} onChange={e=>setNewProdImg(e.target.files[0]||null)} />
            </div>
          </div>
          <button className="btn btn-primary" style={{marginTop:24,padding:'12px 32px'}} onClick={addProduct}>+ ADD PRODUCT</button>
        </div>

        {/* Product list */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:20}}>
          {products.map(p=><div key={p.id} className="card" style={{padding:0,overflow:'hidden',opacity:p.in_stock?1:.55}}>
            {p.image_url
              ? <img src={p.image_url} alt={p.name} style={{width:'100%',height:140,objectFit:'cover',display:'block'}} />
              : <div style={{height:140,background:`linear-gradient(135deg,#1a1a1a,${p.accent_color||'#c0392b'}22)`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:48}}>🧱</div>
            }
            <div style={{padding:20}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><div><div className="label">{p.category}</div><div style={{fontWeight:900,fontSize:17}}>{p.name}</div></div><div style={{fontWeight:900,fontSize:20,color:'#c0392b'}}>GHS {p.price}</div></div>
              <p style={{color:'#666',fontSize:13,fontFamily:'Barlow',lineHeight:1.4,marginBottom:12,minHeight:36}}>{p.description}</p>
              <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:14}}>
                {p.badge&&<span style={{background:'#c0392b',padding:'2px 8px',fontSize:9,fontWeight:900}}>{p.badge}</span>}
                <span style={{color:p.in_stock?'#27ae60':'#e74c3c',fontSize:11,fontWeight:700}}>{p.in_stock?'● IN STOCK':'○ HIDDEN'}</span>
              </div>
              <div style={{display:'flex',gap:8}}>
                <button className="btn btn-outline" style={{flex:1,padding:'7px 10px',fontSize:11}} onClick={()=>{setEditProd({...p});setEditProdImg(null);}}>EDIT</button>
                <button className="btn btn-outline" style={{padding:'7px 14px',fontSize:11,borderColor:p.in_stock?'#e74c3c !important':'#27ae60 !important',color:p.in_stock?'#e74c3c':'#27ae60'}} onClick={()=>toggleStock(p)}>{p.in_stock?'HIDE':'SHOW'}</button>
              </div>
            </div>
          </div>)}
        </div>
      </div>}

      {tab==='quotes'&&<div>
        {quotes.length===0?<div style={{textAlign:'center',padding:'60px 0',color:'#444'}}><div style={{fontSize:48}}>📬</div><p style={{fontFamily:'Barlow',marginTop:16}}>No quote requests yet.</p></div>
          :quotes.map(q=><div key={q.id} className="card" style={{padding:28,marginBottom:16}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16,flexWrap:'wrap',gap:12}}>
              <div><div style={{fontWeight:900,fontSize:18}}>{q.name}</div><div style={{fontFamily:'Barlow',color:'#888',fontSize:14,marginTop:2}}>{q.email}{q.phone?` · ${q.phone}`:''}</div><div style={{fontFamily:'Barlow',color:'#555',fontSize:12,marginTop:4}}>{q.created_at?.slice(0,10)}</div></div>
              <div style={{display:'flex',gap:10,alignItems:'center'}}>
                <span style={{padding:'4px 12px',fontSize:10,fontWeight:900,letterSpacing:1.5,color:q.status==='new'?'#f39c12':'#27ae60',border:`1px solid ${q.status==='new'?'#f39c12':'#27ae60'}`}}>{q.status?.toUpperCase()}</span>
                {q.status==='new'&&<button className="btn btn-primary" style={{padding:'7px 16px',fontSize:11}} onClick={()=>api.patch(`/contact/${q.id}`,{status:'responded'}).then(load)}>MARK RESPONDED</button>}
                <a href={`mailto:${q.email}`} className="btn btn-outline" style={{padding:'7px 16px',fontSize:11,textDecoration:'none'}}>REPLY</a>
              </div>
            </div>
            {q.project_type&&<div style={{marginBottom:8}}><span className="label" style={{display:'inline'}}>PROJECT: </span><span style={{fontWeight:700,fontSize:14}}>{q.project_type}</span></div>}
            <div style={{background:'#0f0f0f',border:'1px solid #1a1a1a',padding:'14px 18px',marginTop:8}}><p style={{fontFamily:'Barlow',color:'#aaa',fontSize:14,lineHeight:1.7,margin:0,fontStyle:'italic'}}>"{q.message}"</p></div>
          </div>)
        }
      </div>}

      {tab==='reviews'&&<div>
        {pending.length===0?<div style={{textAlign:'center',padding:'60px 0',color:'#444'}}><div style={{fontSize:48}}>⭐</div><p style={{fontFamily:'Barlow',marginTop:16}}>No pending reviews.</p></div>
          :pending.map(r=><div key={r.id} className="card" style={{padding:28,marginBottom:16}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12,flexWrap:'wrap',gap:12}}>
              <div><div style={{fontWeight:900,fontSize:16}}>{r.reviewer_name} <span style={{color:'#555',fontWeight:400,fontFamily:'Barlow',fontSize:13}}>on {r.product_name}</span></div><div style={{display:'flex',gap:2,marginTop:6}}>{[1,2,3,4,5].map(n=><span key={n} style={{color:n<=r.rating?'#f39c12':'#333',fontSize:16}}>★</span>)}</div></div>
              <div style={{display:'flex',gap:10}}>
                <button className="btn btn-primary" style={{padding:'8px 18px',fontSize:12}} onClick={()=>api.patch(`/reviews/${r.id}`,{approved:true}).then(load)}>✓ APPROVE</button>
                <button className="btn btn-outline" style={{padding:'8px 18px',fontSize:12,borderColor:'#e74c3c !important',color:'#e74c3c'}} onClick={()=>api.patch(`/reviews/${r.id}`,{approved:false}).then(load)}>✕ REJECT</button>
              </div>
            </div>
            {r.title&&<div style={{fontWeight:700,fontSize:16,marginBottom:8}}>{r.title}</div>}
            {r.body&&<p style={{fontFamily:'Barlow',color:'#888',fontSize:14,lineHeight:1.7,margin:0}}>{r.body}</p>}
          </div>)
        }
      </div>}
    </div>
  );
}

// ── RENDER ────────────────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
